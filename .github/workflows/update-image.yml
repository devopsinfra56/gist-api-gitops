name: Promote Image Tag

# =============================================================================
# This workflow is a MANUAL PROMOTION tool for the gitops repo.
#
# It is NOT triggered by the gist-api CI pipeline.
# The gist-api release.yml handles the automated flow:
#   merge → build → push to DockerHub → checkout this repo → update all
#   values files → open PR → merge → ArgoCD syncs.
#
# Use this workflow when you need to:
#   - Re-deploy a specific image tag to one environment without a new build
#   - Roll back a single environment to an earlier tag
#   - Promote a tag to staging or production independently
#
# Usage: GitHub Actions → Promote Image Tag → Run workflow
#   image_tag:   the datetime tag to deploy  (e.g. 20260602-1937)
#   environment: the target environment      (dev | staging | production)
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 20260602-1937)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve values file
        id: vars
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          ENV="${{ github.event.inputs.environment }}"

          case "$ENV" in
            dev)        VALUES_FILE="helm/gist-api/values-dev.yaml" ;;
            staging)    VALUES_FILE="helm/gist-api/values-staging.yaml" ;;
            production) VALUES_FILE="helm/gist-api/values-production.yaml" ;;
          esac

          echo "tag=${TAG}"                    >> "$GITHUB_OUTPUT"
          echo "env=${ENV}"                    >> "$GITHUB_OUTPUT"
          echo "values_file=${VALUES_FILE}"    >> "$GITHUB_OUTPUT"

      - name: Update image tag in values file
        run: |
          sed -i 's|tag: ".*"|tag: "${{ steps.vars.outputs.tag }}"|' \
            "${{ steps.vars.outputs.values_file }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deploy/${{ steps.vars.outputs.env }}-${{ steps.vars.outputs.tag }}
          commit-message: "deploy(${{ steps.vars.outputs.env }}): update image to ${{ steps.vars.outputs.tag }}"
          title: "deploy(${{ steps.vars.outputs.env }}): update image to ${{ steps.vars.outputs.tag }}"
          body: |
            ## Manual Image Promotion

            | Field | Value |
            |---|---|
            | **Environment** | `${{ steps.vars.outputs.env }}` |
            | **Image** | `devopsinfra56/gist-api:${{ steps.vars.outputs.tag }}` |
            | **Values file** | `${{ steps.vars.outputs.values_file }}` |

            Merging this PR will trigger ArgoCD to sync the `${{ steps.vars.outputs.env }}` environment.
          base: main
          labels: |
            deployment
            ${{ steps.vars.outputs.env }}
