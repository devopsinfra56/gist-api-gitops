apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gist-api-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/devopsinfra56/gist-api-gitops.git
    targetRevision: HEAD
    path: helm/gist-api

    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gist-api-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
